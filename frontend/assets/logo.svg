<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C" />
      <stop offset="50%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#7956EC" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Nail Icon with Sparkle -->
  <g transform="translate(10, 8)">
    <!-- Base finger outline -->
    <rect x="12" y="14" width="22" height="28" rx="11" fill="url(#nailGrad)" filter="url(#glow)"/>
    <!-- Nail highlight -->
    <path d="M16 18 Q23 15 28 20" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- 4-point Sparkle Star -->
    <path d="M36 6 Q37 13 44 14 Q37 15 36 22 Q35 15 28 14 Q35 13 36 6 Z" fill="url(#goldGrad)"/>
    <circle cx="10" cy="36" r="2" fill="#FFE082"/>
  </g>
  
  <!-- Text Brand -->
  <text x="64" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Nail<tspan fill="url(#nailGrad)">Snap</tspan>
  </text>
  <rect x="180" y="18" width="34" height="18" rx="5" fill="url(#nailGrad)"/>
  <text x="188" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    AI
  </text>
  <text x="65" y="48" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#A0A5BA" letter-spacing="1.2">
    VIRTUAL TRY-ON STUDIO
  </text>
</svg>
